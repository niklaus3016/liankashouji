name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEYSTORE_FILE: android/my-release-key.keystore

jobs:
  build-android:
    name: Build debug and release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web and sync Android assets
        run: npm run build:android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          ls -lh "$KEYSTORE_FILE"

      - name: Output signing certificate SHA1 and SHA256
        id: signing_cert
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          STORE_TYPE="${KEYSTORE_TYPE:-PKCS12}"
          INFO=$(keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype "$STORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias liankashouji)
          SHA1=$(printf '%s\n' "$INFO" | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          SHA256=$(printf '%s\n' "$INFO" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          SHA1_NO_COLONS=$(printf '%s' "$SHA1" | tr -d ':')
          SHA256_NO_COLONS=$(printf '%s' "$SHA256" | tr -d ':')
          if [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
            echo "未能从 keystore 提取 SHA1/SHA256"
            exit 1
          fi
          {
            echo "SHA1=$SHA1"
            echo "SHA1_NO_COLONS=$SHA1_NO_COLONS"
            echo "SHA256=$SHA256"
            echo "SHA256_NO_COLONS=$SHA256_NO_COLONS"
          } | tee /tmp/signing-fingerprints.txt
          {
            echo "sha1=$SHA1"
            echo "sha1_no_colons=$SHA1_NO_COLONS"
            echo "sha256=$SHA256"
            echo "sha256_no_colons=$SHA256_NO_COLONS"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 签名证书指纹"
            echo ""
            echo "- SHA1：\`$SHA1\`"
            echo "- SHA1（无冒号）：\`$SHA1_NO_COLONS\`"
            echo "- SHA256：\`$SHA256\`"
            echo "- SHA256（无冒号）：\`$SHA256_NO_COLONS\`"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p checksums
          cp /tmp/signing-fingerprints.txt checksums/signing-fingerprints.txt

      - name: Upload signing fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: lianka-shouji-signing-fingerprints
          path: checksums/signing-fingerprints.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lianka-shouji-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Output APK SHA1 and SHA256
        run: |
          mkdir -p checksums
          for apk in \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$apk" ]; then
              APK_SHA1=$(sha1sum "$apk" | awk '{print $1}')
              APK_SHA1_WITH_COLONS=$(printf '%s' "$APK_SHA1" | sed 's/../&:/g;s/:$//')
              APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')
              APK_SHA256_WITH_COLONS=$(printf '%s' "$APK_SHA256" | sed 's/../&:/g;s/:$//')
              {
                echo "== $apk =="
                echo "SHA1=$APK_SHA1"
                echo "SHA1_WITH_COLONS=$APK_SHA1_WITH_COLONS"
                echo "SHA256=$APK_SHA256"
                echo "SHA256_WITH_COLONS=$APK_SHA256_WITH_COLONS"
              } | tee -a checksums/apk-fingerprints.txt
              {
                echo "### APK 校验值"
                echo ""
                echo "- SHA1：\`$APK_SHA1\`"
                echo "- SHA1（带冒号）：\`$APK_SHA1_WITH_COLONS\`"
                echo "- SHA256：\`$APK_SHA256\`"
                echo "- SHA256（带冒号）：\`$APK_SHA256_WITH_COLONS\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload APK fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: lianka-shouji-apk-fingerprints
          path: checksums/apk-fingerprints.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lianka-shouji-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
